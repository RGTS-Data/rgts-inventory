<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>單據列印</title><link rel="stylesheet" href="/_lib/app.css">
<style>
/* 列印用版面：一張單一頁 A4，工具列不印 */
.tools{display:flex;gap:8px;align-items:center;margin:14px 16px}
.sheet{background:#fff;max-width:1000px;margin:0 auto 24px;padding:18px 22px;border:1px solid var(--line);border-radius:8px}
.sheet h1{text-align:center;font-size:20px;margin:0 0 4px;letter-spacing:4px}
.sheet .sub{text-align:center;color:var(--muted);margin-bottom:12px}
.hd{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 16px;font-size:12px;margin-bottom:10px}
.hd b{color:var(--label);font-weight:600;margin-right:4px}
.sheet table{font-size:12px}
.sheet th,.sheet td{border:1px solid #94a3b8;padding:4px 6px}
.sheet th{position:static;background:#f1f5f9}
.sheet tr.zero td{color:#64748b}
.sheet tfoot td{font-weight:700;background:#f8fafc}
.sign{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px;font-size:12px}
.sign div{border-top:1px solid #475569;padding-top:4px;text-align:center;color:var(--label)}
.formno{margin-top:10px;font-size:11px;color:var(--muted);text-align:right}
@page{size:A4 landscape;margin:10mm}
@media print{.tools,header.top,.msg{display:none!important}body{background:#fff}.sheet{border:0;padding:0;max-width:none;margin:0}
  body>:not(header.top):not(script){margin-left:0;margin-right:0}thead{display:table-header-group}tr{page-break-inside:avoid}}
</style></head><body>
<script src="/_lib/nav.js"></script>
<h2>單據列印／匯出</h2>
<div class="tools">
  <button id="pr" class="pri">🖨 列印</button>
  <button id="xl">📊 匯出 Excel</button>
  <a class="pn" id="back" href="/docs.html">← 回單據查詢</a>
  <span id="msg" class="msg"></span>
</div>
<div id="sheet" class="sheet"><p class="muted">載入中…</p></div>
<script src="/_lib/auth.js"></script><script src="/_lib/common.js"></script><script src="/_lib/xlsx.js"></script>
<script>
// 表單編號同各頁右下角（ISO 9001 四階表單）
var FORMNO={receipt:'8081A',issue:'8082A',transfer:'8083A'};
var DOC=null, LINES=[];
var STXT={pending:'待確認收貨',posted:'已過帳',rejected:'退回',void:'作廢',draft:'草稿'};
function dt(s){return s?String(s).slice(0,16).replace('T',' '):''}
// 各單別的明細欄位：[表頭, 取值, 是否數字]
function cols(t){
  var c=[['#',function(l){return l.seq}],['料號',function(l){return l.part_no||''}],['品名規格',function(l){return l.name||''}]];
  if(t==='receipt')c.splice(1,0,['來源採購單',function(l){return l.po_no||''}]);
  c.push([t==='issue'?'領料數量':'數量',function(l){return Number(l.qty)},1]);
  if(t==='transfer')c.push(['撥出倉',function(l){return l.wh_code||''}],['撥入倉',function(l){return l.to_wh||''}]);
  else c.push(['倉庫',function(l){return l.wh_code||''}],['儲位',function(l){return l.location||''}]);
  if(t==='receipt')c.push(['單價',function(l){return l.unit_price==null?'':Number(l.unit_price)},1],['金額',function(l){return l.amount==null?'':Number(l.amount)},1]);
  c.push(['備註',function(l){return (l.kind==='loss'?'[損耗] ':'')+(t==='issue'&&!(Math.abs(Number(l.qty))>0)&&!/^未領/.test(l.note||'')?'[未領] ':'')+(l.note||'')}]);
  return c;
}
function title(h){return (h.reverses?'反向單（'+U.TYPE[h.doc_type]+'）':U.TYPE[h.doc_type])||h.doc_type}
function render(){
  var h=DOC,t=h.doc_type,R=t==='receipt',C=cols(t);
  var tq=LINES.reduce(function(s,l){return s+U.num(l.qty)},0), ta=LINES.reduce(function(s,l){return s+U.num(l.amount)},0);
  var zero=LINES.filter(function(l){return !(Math.abs(Number(l.qty))>0)}).length;
  var f=function(k,v){return v==null||v===''?'':'<div><b>'+k+'</b>'+U.esc(v)+'</div>'};
  var hd=f('單號',h.doc_no)+f('日期',h.doc_date)+f('狀態',STXT[h.status]||h.status)+
    (R?f('廠商',h.vendor)+f('幣別',h.currency||'NTD')+f('匯率',h.fx_rate)+f('發票號碼',h.invoice_no)+f('發票日期',h.invoice_date)+f('發票未稅金額',h.invoice_amount==null?'':U.fmt(h.invoice_amount))
       :f('專案',h.project_no))+
    (h.jig?f('治具',(U.JIG[h.jig]||h.jig)+(h.jig_note?'（'+h.jig_note+'）':'')):'')+
    f('製單',h.created_by)+f(R?'確認收貨':'核對',h.checked_by)+f('過帳',dt(h.posted_at))+
    (h.reverses?f('沖銷原單',h.reverses):'')+(h.reversed_by?f('已被沖銷',h.reversed_by):'')+
    (h.note?'<div style="grid-column:1/-1"><b>備註</b>'+U.esc(h.note)+'</div>':'');
  var body=LINES.map(function(l){var z=t==='issue'&&!(Math.abs(Number(l.qty))>0);
    return'<tr'+(z?' class="zero"':'')+'>'+C.map(function(c){var v=c[1](l);return'<td'+(c[2]?' class="n"':'')+'>'+(c[2]&&v!==''?U.fmt(v):U.esc(v))+'</td>'}).join('')+'</tr>'}).join('');
  var qi=C.findIndex(function(c){return /數量/.test(c[0])});
  var foot='<tr>'+C.map(function(c,i){
    if(i===0)return'<td colspan="'+qi+'">合計 '+LINES.length+' 列'+(zero?'（其中未領 '+zero+' 列）':'')+'</td>';
    if(i<qi)return'';if(i===qi)return'<td class="n">'+U.fmt(tq)+'</td>';
    if(c[0]==='金額')return'<td class="n">'+U.fmt(Math.round(ta*100)/100)+'</td>';return'<td></td>'}).join('')+'</tr>';
  var sign=t==='receipt'?['製單','確認收貨','倉管','會計']:t==='issue'?['製單','發料','領料','主管']:['製單','撥出','撥入','主管'];
  U.$('sheet').innerHTML='<h1>'+U.esc(title(h))+'</h1><div class="sub">'+U.esc(h.doc_no)+'</div><div class="hd">'+hd+'</div>'+
    '<table><thead><tr>'+C.map(function(c){return'<th'+(c[2]?' class="n"':'')+'>'+c[0]+'</th>'}).join('')+'</tr></thead><tbody>'+body+'</tbody><tfoot>'+foot+'</tfoot></table>'+
    '<div class="sign">'+sign.map(function(s){return'<div>'+s+'</div>'}).join('')+'</div>'+
    '<div class="formno">ISO 表單 '+(FORMNO[t]||'')+' '+U.esc(U.TYPE[t]||'')+'　｜　列印時間 '+U.esc(dt(new Date(Date.now()+8*3600e3).toISOString()))+'</div>';
  document.title=h.doc_no+' '+title(h);
}
function exportXlsx(){
  if(!DOC)return;
  var h=DOC,t=h.doc_type,C=cols(t);
  var head=['單號','單別','日期','狀態',t==='receipt'?'廠商':'專案'].concat(C.slice(1).map(function(c){return c[0]}));
  var rows=[head].concat(LINES.map(function(l){
    return [h.doc_no,title(h),h.doc_date,STXT[h.status]||h.status,t==='receipt'?(h.vendor||''):(h.project_no||'')].concat(C.slice(1).map(function(c){return c[1](l)}))}));
  // 單號／料號／採購單號／倉別／儲位一律當文字（純數字料號像 11190006 才不會被 Excel 轉成數字）
  var text=[0,2];head.forEach(function(k,i){if(/料號|採購單|倉|儲位|專案/.test(k))text.push(i)});
  INVXlsx.download(h.doc_no+'_'+(U.TYPE[t]||t)+'.xlsx',{sheet:h.doc_no,rows:rows,textCols:text,
    widths:head.map(function(k){return /品名/.test(k)?40:/備註/.test(k)?30:/單號|採購單|料號|廠商|專案/.test(k)?18:10}),wrapCols:[head.indexOf('品名規格')]});
}
U.$('pr').onclick=function(){window.print()};
U.$('xl').onclick=exportXlsx;
INVAuth.tryAutoLogin().then(async function(){
  var sp=new URLSearchParams(location.search),no=sp.get('doc')||'';
  if(!no){U.$('sheet').innerHTML='<p class="err">網址要帶 ?doc=單號</p>';return}
  U.$('back').href='/docs.html?doc='+encodeURIComponent(no);
  try{var d=await U.api('/api/docs/get?doc_no='+encodeURIComponent(no)+'&_='+Date.now());DOC=d.doc;LINES=d.lines;render();
    if(sp.get('auto')==='print')setTimeout(function(){window.print()},300);
    if(sp.get('auto')==='xlsx')exportXlsx();
  }catch(e){U.$('sheet').innerHTML='<p class="err">'+U.esc(e.message)+'</p>'}
});
</script></body></html>
