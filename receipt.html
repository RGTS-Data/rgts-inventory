<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>進貨單</title><link rel="stylesheet" href="/_lib/app.css"></head><body>
<script src="/_lib/nav.js"></script>
<h2>進貨單（從採購單帶入）</h2>
<p class="muted">① 查採購單（<b>多張採購單</b>：單號用空白或逗號隔開一次查，或查完一張勾好再查下一張，已勾的會留著）→ 勾要進貨的明細、填數量 → ② 有發票就填（沒有可留空，之後在「單據查詢」補）→ 存成「待核對」→ ③ 阿國「確認收貨」就入庫；發票金額另外核對。運費這種沒料號的列可以勾，只算金額不入庫。採購總表到貨日目前<b>不會</b>回寫。</p>

<div class="card">
  <h3>① 查採購單</h3>
  <div class="bar">
    <input id="q" placeholder="採購單號 / 料號 / 廠商 / 專案（多張用空白或逗號隔開）" style="width:380px">
    <label><input type="checkbox" id="all"> 含已入滿</label>
    <button id="go" class="pri">查詢</button>
    <button id="unsel">清除已勾選</button>
    <span id="info" class="muted"></span>
  </div>
  <div style="max-height:45vh;overflow:auto">
  <table><thead><tr>
    <th><input type="checkbox" id="ckall" title="全選"></th><th>採購單號</th><th>廠商</th><th>料號</th><th>品名規格</th><th>專案</th>
    <th class="n">採購量</th><th class="n">已入</th><th class="n">待核對</th><th class="n">本次數量</th><th>入庫倉</th><th>幣別</th><th class="n">單價</th><th class="n">金額</th>
  </tr></thead><tbody id="bd"><tr><td colspan="14" class="muted">輸入條件查詢</td></tr></tbody></table>
  </div>
</div>

<div class="card">
  <h3>② 進貨單表頭</h3>
  <div class="grid">
    <label>進貨日期<input type="date" id="dd"></label>
    <label>廠商<input id="vendor" readonly placeholder="勾選明細後自動帶入"></label>
    <label>發票號碼<input id="inv" placeholder="沒有可留空，之後補"></label>
    <label>發票日期<input type="date" id="invd"></label>
    <label>發票未稅金額<input id="amt" placeholder="沒有可留空（原幣）"></label>
    <label>幣別<input id="cur" readonly placeholder="依採購單自動帶入"></label>
    <label>匯率<input id="fx" placeholder="依廠商發票（台幣免填）"></label>
    <label style="grid-column:span 2">備註<input id="note"></label>
  </div>
  <p>已選 <b id="cnt">0</b> 列，採購未稅合計 <b id="tot">0</b>　<span id="diff"></span></p>
  <button id="save" class="pri">存成進貨單（待核對）</button>
  <div id="msg" class="msg"></div>
</div>

<script src="/_lib/auth.js"></script><script src="/_lib/common.js"></script>
<script>
var ROWS=[], SEL={};   // SEL[id] = {qty, wh, row}；row＝勾選當下的採購明細，換查詢條件後已勾的列照樣留著（一張進貨單可含多張採購單）
function key(x){return String(x.id)}
function cur(x){var c=String(x.currency||'').trim().toUpperCase();return !c||c==='TWD'||c==='NT'?'NTD':c}
function left(x){return Math.max(0,U.num(x.qty)-x.received-x.pending)}
function view(){   // 畫面列＝其他查詢已勾的列（置頂）＋本次查詢結果
  var here={};ROWS.forEach(function(x){here[key(x)]=1});
  return Object.keys(SEL).filter(function(id){return !here[id]&&SEL[id].row}).map(function(id){return SEL[id].row}).concat(ROWS);
}
function findRow(id){return ROWS.find(function(r){return String(r.id)===id})||(SEL[id]&&SEL[id].row)}
function render(){
  U.$('bd').innerHTML=view().map(function(x){
    var s=SEL[key(x)], l=left(x), dis=l<=0?' disabled':'';
    return '<tr class="'+(s?'sel':'')+'"><td><input type="checkbox" data-ck="'+x.id+'"'+(s?' checked':'')+dis+'></td>'+
      '<td>'+U.esc(x.po_no)+'<div class="muted">'+U.esc(x.order_date||'')+'</div></td><td>'+U.esc(x.vendor)+'</td>'+
      '<td>'+(x.is_fee?'<span class="tag muted">無料號・不入庫</span>':'<a class="pn" href="/part.html?part='+encodeURIComponent(x.part_no)+'" target="_blank">'+U.esc(x.part_no)+'</a>')+'</td>'+
      '<td>'+U.esc(x.name)+'<div class="muted">'+U.esc(x.spec||'')+'</div></td><td>'+U.esc(x.project_no||'')+'</td>'+
      '<td class="n">'+U.fmt(x.qty)+'</td><td class="n">'+U.fmt(x.received)+'</td><td class="n">'+(x.pending?'<span class="tag wait">'+U.fmt(x.pending)+'</span>':'0')+'</td>'+
      '<td class="n"><input class="q" data-qty="'+x.id+'" value="'+(s?s.qty:l)+'"'+dis+'></td><td>'+(x.is_fee?'<span class="muted">—</span>':U.whSel('data-wh="'+x.id+'"'+dis,s?s.wh:'Z'))+'</td><td>'+U.esc(cur(x))+'</td>'+
      '<td class="n">'+U.fmt(x.unit_price)+'</td><td class="n" data-amt="'+x.id+'">'+U.fmt(U.num(x.unit_price)*(s?s.qty:l))+'</td></tr>';
  }).join('')||'<tr><td colspan="14" class="muted">沒有符合的採購明細</td></tr>';
  summary();
}
function summary(){
  var ids=Object.keys(SEL), tot=0, vend={}, curs={}, pos={};
  ids.forEach(function(id){var x=findRow(id);if(!x)return;pos[x.po_no]=1;tot+=U.num(x.unit_price)*SEL[id].qty;vend[x.vendor]=1;curs[cur(x)]=1});
  tot=Math.round(tot*100)/100;
  U.$('cnt').textContent=ids.length+(Object.keys(pos).length>1?'（'+Object.keys(pos).length+' 張採購單）':'');U.$('tot').textContent=U.fmt(tot);
  var vs=Object.keys(vend);U.$('vendor').value=vs.join('、');
  var cs=Object.keys(curs);U.$('cur').value=cs.join('、');
  var ntd=cs.length===1&&cs[0]==='NTD';U.$('fx').disabled=ntd;if(ntd)U.$('fx').value='1';else if(U.$('fx').value==='1'&&!cs.length)U.$('fx').value='';
  var a=U.$('amt').value.trim(), d=U.$('diff');
  if(vs.length>1){d.innerHTML='<span class="err">⚠ 一張進貨單只能同一家廠商</span>';return}
  if(cs.length>1){d.innerHTML='<span class="err">⚠ 一張進貨單只能同一種幣別</span>';return}
  if(a===''){d.innerHTML=ids.length?'<span class="muted">還沒有發票：存檔後可在「單據查詢」補</span>':'';return}
  var df=Math.round((U.num(a)-tot)*100)/100;
  d.innerHTML=Math.abs(df)<=1?'<span class="good">✓ 發票與採購金額一致</span>':'<span class="err">差 '+U.fmt(df)+'（不一致，發票核對時會擋；不影響入庫）</span>';
}
async function search(){
  if(!/^已建立/.test(U.$('msg').textContent))U.msg('查詢中…');
  try{var d=await U.api('/api/receipt/lines?q='+encodeURIComponent(U.$('q').value.trim())+(U.$('all').checked?'&all=1':'')+'&_='+Date.now());
    ROWS=d.rows;render();if(/中…$/.test(U.$('msg').textContent))U.msg('');U.$('info').textContent=ROWS.length+' 列'+(d.terms&&d.terms.length>1?'（'+d.terms.length+' 個條件）':'')+(d.truncated?'（只列前 300，請縮小條件）':'');U.$('ckall').checked=false;
  }catch(e){U.msg(e.message,'err')}
}
U.$('go').onclick=search;U.$('q').onkeydown=function(e){if(e.key==='Enter')search()};
U.$('bd').addEventListener('change',function(e){
  var t=e.target,id=t.dataset.ck||t.dataset.qty||t.dataset.wh;if(!id)return;
  var x=findRow(id);
  if(t.dataset.ck){ if(t.checked){var w=document.querySelector('[data-wh="'+id+'"]');SEL[id]={qty:U.num(document.querySelector('[data-qty="'+id+'"]').value),wh:w?w.value:null,row:x}} else delete SEL[id]; render(); return; }
  if(t.dataset.qty){ var q=U.num(t.value); if(SEL[id])SEL[id].qty=q; document.querySelector('[data-amt="'+id+'"]').textContent=U.fmt(U.num(x.unit_price)*q); summary(); }
  if(t.dataset.wh && SEL[id]) SEL[id].wh=t.value;
});
U.$('ckall').onchange=function(){var on=this.checked;ROWS.forEach(function(x){if(left(x)<=0)return;var id=key(x);if(on)SEL[id]=SEL[id]||{qty:left(x),wh:x.is_fee?null:'Z',row:x};else delete SEL[id]});render()};
U.$('unsel').onclick=function(){if(Object.keys(SEL).length&&!confirm('清除全部已勾選的明細？'))return;SEL={};U.$('ckall').checked=false;render()};
U.$('amt').oninput=summary;
U.$('save').onclick=async function(){
  var ids=Object.keys(SEL);if(!ids.length){U.msg('請先勾選要進貨的明細','err');return}
  var body={doc_date:U.$('dd').value,invoice_no:U.$('inv').value.trim(),invoice_date:U.$('invd').value,invoice_amount:U.$('amt').value.trim(),fx_rate:U.$('fx').disabled?'':U.$('fx').value.trim(),note:U.$('note').value.trim(),
    lines:ids.map(function(id){return{po_line_id:+id,qty:SEL[id].qty,wh_code:SEL[id].wh}})};
  this.disabled=true;
  try{var r=await U.api('/api/docs/receipt',body);
    U.docMsg('已建立進貨單 '+r.doc_no+'（待阿國確認收貨入庫'+(body.invoice_no?'':'；發票之後在「單據查詢」補')+'）',r.doc_no);SEL={};['inv','invd','amt','fx','note'].forEach(function(k){U.$(k).value=''});search();
  }catch(e){U.msg(e.message,'err')}finally{this.disabled=false}
};
U.$('dd').value=U.today();
INVAuth.tryAutoLogin().then(function(){var q=new URLSearchParams(location.search).get('q');if(q){U.$('q').value=q;search()}});
</script>
<!-- ISO 9001 四階表單編號（QMS registry），列印時隱藏 -->
<style>.iso-form-no{position:fixed;right:8px;bottom:6px;z-index:9999;pointer-events:none;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#6b7785;background:rgba(255,255,255,.85);border:1px solid #d5dbe1;border-radius:4px;padding:1px 6px}@media print{.iso-form-no{display:none}}</style>
<div class="iso-form-no">ISO 表單 8081A 進貨單</div>
</body></html>
