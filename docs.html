<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>單據查詢</title><link rel="stylesheet" href="/_lib/app.css"></head><body>
<script src="/_lib/nav.js"></script>
<h2>單據查詢／進貨核對</h2>
<div class="bar">
  <select id="type"><option value="">全部單據</option><option value="receipt">進貨單</option><option value="issue">領料單</option><option value="transfer">調撥單</option></select>
  <select id="status"><option value="">全部狀態</option><option value="pending">待確認收貨</option><option value="posted">已過帳</option><option value="rejected">退回</option><option value="void">作廢</option></select>
  <select id="inv"><option value="">發票：全部</option><option value="todo">發票待補／待核對</option></select>
  <input type="date" id="from"> ~ <input type="date" id="to">
  <input id="q" placeholder="單號／廠商／發票／專案／料號／採購單號" style="width:260px">
  <button id="go" class="pri">查詢</button><span id="info" class="muted"></span>
</div>
<div id="msg" class="msg"></div>
<table><thead><tr><th>單號</th><th>類型</th><th>日期</th><th>狀態</th><th>廠商／專案</th><th>發票</th><th>發票狀態</th><th class="n">發票金額</th><th class="n">採購金額</th><th class="n">列數</th><th class="n">數量</th><th>製單</th></tr></thead><tbody id="bd"></tbody></table>
<div id="detail"></div>
<script src="/_lib/auth.js"></script><script src="/_lib/common.js"></script>
<script>
var CAN=false;
// 發票狀態：只有進貨單（非反向單）有
function invTag(x){
  if(x.doc_type!=='receipt'||x.reverses||x.status==='void'||x.status==='rejected')return'';
  if(x.inv_checked_at)return'<span class="tag ok">已核對</span>';
  if(!x.invoice_no||x.invoice_amount==null)return'<span class="tag wait">待補發票</span>';
  return'<span class="tag wait">待核對</span>';
}
async function load(){
  var q=['type','status','inv','from','to','q'].map(function(k){return k+'='+encodeURIComponent(U.$(k).value.trim())}).join('&');
  try{var d=await U.api('/api/docs/list?'+q+'&_='+Date.now());CAN=d.can_check;
    U.$('info').textContent=d.rows.length+' 張'+(CAN?'　｜ 你可以核對進貨單':'');
    U.$('bd').innerHTML=d.rows.map(function(x){
      var hasInv=x.doc_type==='receipt'&&x.invoice_amount!=null, diff=hasInv?Math.round((U.num(x.invoice_amount)-U.num(x.amount_total))*100)/100:0;
      return '<tr><td><a class="pn" href="#" data-doc="'+x.doc_no+'">'+x.doc_no+'</a></td><td>'+U.TYPE[x.doc_type]+(x.reverses?' <span class="tag bad">沖銷</span>':'')+(x.reversed_by?' <span class="tag muted">已沖銷</span>':'')+(x.jig?' <span class="tag '+(x.jig==='sent'?'ok':'muted')+'">'+U.esc(U.JIG[x.jig]||x.jig)+'</span>':'')+'</td><td>'+x.doc_date+'</td><td>'+(U.STATUS[x.status]||x.status)+'</td>'+
        '<td>'+U.esc(x.vendor||x.project_no||'')+'</td><td>'+U.esc(x.invoice_no||'')+'</td><td>'+invTag(x)+'</td>'+
        '<td class="n">'+(hasInv?(x.currency&&x.currency!=='NTD'?x.currency+' ':'')+U.fmt(x.invoice_amount):'')+'</td><td class="n">'+(x.doc_type==='receipt'?U.fmt(x.amount_total)+(Math.abs(diff)>1?' <span class="err">差 '+U.fmt(diff)+'</span>':''):'')+'</td>'+
        '<td class="n">'+x.line_count+'</td><td class="n">'+U.fmt(x.qty_total)+'</td><td class="muted">'+U.esc(x.created_by)+'</td></tr>'}).join('')||'<tr><td colspan="12" class="muted">沒有單據</td></tr>';
  }catch(e){U.msg(e.message,'err')}
}
// 發票區：還沒核對完成可以補／改；阿國可標記核對完成（金額差 ≤1 才過）
function invBox(h,tot){
  var lock=!!h.inv_checked_at||h.status==='void'||h.status==='rejected', ntd=(h.currency||'NTD')==='NTD';
  var diff=h.invoice_amount==null?null:Math.round((U.num(h.invoice_amount)-tot)*100)/100;
  var inp=function(k,lab,v,type,dis){return'<label>'+lab+'<input id="f_'+k+'"'+(type?' type="'+type+'"':'')+' value="'+U.esc(v==null?'':v)+'"'+(lock||dis?' disabled':'')+'></label>'};
  var st=h.inv_checked_at?'<span class="tag ok">發票已核對</span> <span class="muted">'+U.esc(h.inv_checked_by)+' '+h.inv_checked_at.slice(0,16).replace('T',' ')+(h.inv_check_note?'・'+U.esc(h.inv_check_note):'')+'</span>'
    :(!h.invoice_no||h.invoice_amount==null?'<span class="tag wait">待補發票</span>':'<span class="tag wait">發票待核對</span>');
  var cmp=diff==null?'':(Math.abs(diff)<=1?' <span class="good">✓ 與採購金額一致</span>':' <span class="err">與採購金額差 '+U.fmt(diff)+'</span>');
  return'<div class="card" style="margin:10px 0 0;background:var(--bg)"><h3>發票 '+st+cmp+'</h3><div class="grid">'+
    inp('invoice_no','發票號碼',h.invoice_no)+inp('invoice_date','發票日期',h.invoice_date,'date')+
    inp('invoice_amount','發票未稅金額（'+U.esc(h.currency||'NTD')+'）',h.invoice_amount)+inp('fx_rate','匯率',ntd?1:h.fx_rate,'',ntd)+'</div>'+
    (lock?'':'<p><button data-act="invsave">💾 儲存發票</button>'+(CAN?' <input id="inote" placeholder="核對備註" style="width:220px"> <button class="pri" data-act="invok">✓ 發票核對完成</button>':'')+'</p>')+'</div>';
}
async function show(no){
  try{var d=await U.api('/api/docs/get?doc_no='+encodeURIComponent(no)+'&_='+Date.now()),h=d.doc,R=h.doc_type==='receipt',T=h.doc_type==='transfer';
    var tot=d.lines.reduce(function(s,l){return s+U.num(l.amount)},0);
    var act='';
    if(R&&h.status==='pending'){
      act=CAN?'<p><input id="cnote" placeholder="備註（退回請寫原因）" style="width:300px"> <button class="pri" data-act="approve">✓ 確認收貨，入庫</button> <button data-act="reject">✗ 退回</button></p>'
             :'<p class="muted">待阿國確認收貨入庫。</p>';
      act+='<p><button data-act="void">作廢這張單</button></p>';
    } else if(h.status==='posted'&&!h.reverses&&!h.reversed_by){
      act='<p><input id="rnote" placeholder="沖銷原因（必填）" style="width:300px"> <button data-act="reverse">↩ 開反向單沖銷</button> <span class="muted">已過帳不能作廢；反向單會把數量全部反向過帳'+(R?'（進貨單限阿國）':'')+'</span></p>';
    } else if(R&&h.status==='rejected') act='<p class="err">退回原因：'+U.esc(h.check_note||'')+'</p><p><button data-act="void">作廢這張單</button>（修正後請重開一張）</p>';
    U.$('detail').innerHTML='<div class="card"><h3>'+(h.reverses?'反向單（'+U.TYPE[h.doc_type]+'）':U.TYPE[h.doc_type])+' '+h.doc_no+'　'+(U.STATUS[h.status]||h.status)+(h.reverses?' <span class="tag bad">沖銷 <a class="pn" href="#" data-doc="'+h.reverses+'">'+h.reverses+'</a></span>':'')+(h.reversed_by?' <span class="tag bad">已被 <a class="pn" href="#" data-doc="'+h.reversed_by+'">'+h.reversed_by+'</a> 沖銷</span>':'')+
      '　<a class="pn" href="/print.html?doc='+encodeURIComponent(h.doc_no)+'" target="_blank">🖨 列印</a>　<a class="pn" href="/print.html?doc='+encodeURIComponent(h.doc_no)+'&auto=xlsx" target="_blank">📊 匯出 Excel</a></h3>'+
      '<div class="grid"><div>進貨日期：'+h.doc_date+'</div>'+(R?'<div>廠商：'+U.esc(h.vendor)+'</div><div>幣別：'+U.esc(h.currency||'NTD')+'</div><div>採購未稅合計：'+U.fmt(tot)+'</div>':'<div>專案：'+U.esc(h.project_no||'')+'</div>')+
      (h.jig?'<div style="grid-column:span 2">治具：<b>'+U.esc(U.JIG[h.jig]||h.jig)+'</b>'+(h.jig_note?'（'+U.esc(h.jig_note)+'）':'')+'</div>':'')+
      '<div>製單：'+U.esc(h.created_by)+'</div>'+(h.checked_by?'<div>核對：'+U.esc(h.checked_by)+'</div>':'')+(h.posted_at?'<div>過帳：'+h.posted_at.slice(0,16).replace('T',' ')+'</div>':'')+'<div style="grid-column:span 2">備註：'+U.esc(h.note||'')+'</div></div>'+
      '<table style="margin-top:8px"><thead><tr><th>#</th><th>料號</th><th>品名</th><th class="n">數量</th><th>'+(T?'撥出倉</th><th>撥入倉':'倉庫')+'</th>'+(R?'<th>來源採購單</th><th class="n">單價</th><th class="n">金額</th>':'')+'<th>備註</th></tr></thead><tbody>'+
      d.lines.map(function(l){return'<tr><td>'+l.seq+'</td><td><a class="pn" href="/part.html?part='+encodeURIComponent(l.part_no||'')+'">'+U.esc(l.part_no)+'</a></td><td>'+U.esc(l.name||'')+'</td><td class="n">'+U.fmt(l.qty)+'</td><td>'+U.esc(l.wh_code||'')+'</td>'+(T?'<td>'+U.esc(l.to_wh||'')+'</td>':'')+(R?'<td>'+U.esc(l.po_no||'')+'</td><td class="n">'+U.fmt(l.unit_price)+'</td><td class="n">'+U.fmt(l.amount)+'</td>':'')+'<td>'+(l.kind==='loss'?'<span class="tag" style="background:#fde68a">損耗</span> ':'')+(h.doc_type==='issue'&&!(Math.abs(Number(l.qty))>0)&&!/^未領/.test(l.note||'')?'<span class="tag muted">未領</span> ':'')+U.esc(l.note||'')+'</td></tr>'}).join('')+
      '</tbody></table>'+(R&&!h.reverses?invBox(h,tot):'')+act+'</div>';
    U.$('detail').querySelectorAll('[data-act]').forEach(function(b){b.onclick=async function(){
      var a=b.dataset.act;
      try{
        if(a==='void'){if(!confirm('作廢 '+no+'？'))return;await U.api('/api/docs/void',{doc_no:no});}
        else if(a==='invsave'){var body={doc_no:no};['invoice_no','invoice_date','invoice_amount','fx_rate'].forEach(function(k){var el=U.$('f_'+k);if(el&&!el.disabled)body[k]=el.value.trim()});
          await U.api('/api/docs/invoice',body);U.msg(no+' 發票已儲存','good');load();show(no);return;}
        else if(a==='invok'){if(!confirm('確認發票與採購金額一致，標記發票核對完成？之後發票欄位就不能再改。'))return;
          await U.api('/api/docs/check',{doc_no:no,action:'invoice_ok',note:(U.$('inote')||{}).value||''});U.msg(no+' 發票核對完成','good');load();show(no);return;}
        else if(a==='reverse'){var rn=(U.$('rnote')||{}).value||'';if(!rn.trim()){U.msg('請寫沖銷原因','err');return}
          if(!confirm('開反向單沖銷 '+no+'？整張數量會反向過帳。'))return;var rv=await U.api('/api/docs/reverse',{doc_no:no,note:rn});U.msg('已開反向單 '+rv.doc_no+'（沖銷 '+no+'）','good');load();show(rv.doc_no);return;}
        else{if(a==='approve'&&!confirm('確認已收到貨，入庫？（發票可之後再補、再核對）'))return;
          await U.api('/api/docs/check',{doc_no:no,action:a,note:(U.$('cnote')||{}).value||''});}
        U.msg(no+(a==='approve'?' 已確認收貨入庫':a==='reject'?' 已退回':' 已作廢'),'good');load();show(no);
      }catch(e){U.msg(e.message,'err')}
    }});
    U.$('detail').scrollIntoView({behavior:'smooth'});
  }catch(e){U.msg(e.message,'err')}
}
U.$('go').onclick=load;U.$('q').onkeydown=function(e){if(e.key==='Enter')load()};
U.$('bd').onclick=function(e){var a=e.target.closest('[data-doc]');if(!a)return;e.preventDefault();show(a.dataset.doc)};
U.$('detail').addEventListener('click',function(e){var a=e.target.closest('a[data-doc]');if(!a)return;e.preventDefault();show(a.dataset.doc)});
INVAuth.tryAutoLogin().then(async function(){
  var sp=new URLSearchParams(location.search);if(sp.get('status'))U.$('status').value=sp.get('status');if(sp.get('inv'))U.$('inv').value=sp.get('inv');
  await load();if(sp.get('doc'))show(sp.get('doc'));
});
</script></body></html>
